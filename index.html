<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Recommendation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        nav {
            background-color: #234e70;
            padding: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }
        main {
            text-align: center;
            padding: 80px 20px;
        }
        
nav {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

nav input {
    padding: 10px;
    border: none;
    border-radius: 5px;
    margin-left: auto;
}

nav button {
    padding: 10px 15px;
    background-color: white;
    color: #234e70;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

nav button:hover {
    background-color: #dddddd;
}

#results {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
}

.place {
    background: white;
    width: 300px;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #cccccc;
}

.place img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
}


    </style>
</head>
<body>
    
<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>

    <input type="text" id="searchInput"
           placeholder="Search destinations">

    <button type="button" onclick="searchPlaces()">
        Search
    </button>

    <button type="button" onclick="clearSearch()">
        Clear
    </button>
</nav>

    <main>
<div id="results"></div>
        <h1>Welcome to Travel Recommendation</h1>
        <p>Discover beautiful destinations around the world.</p>
        <p>Explore beaches, temples, and countries for your next trip.</p>
    </main>
    
<script>
    function searchPlaces() {
        const search = document.getElementById("searchInput")
            .value.toLowerCase().trim();

        const results = document.getElementById("results");

        if (search.includes("beach")) {
            results.innerHTML = `
                <div class="place">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                         alt="Tropical beach">
                    <h2>Whitehaven Beach</h2>
                    <p>A beautiful beach in Australia,
                    famous for its white sand.</p>
                </div>

                <div class="place">
                    <img src="https://images.unsplash.com/photo-1473116763249-2faaef81ccda"
                         alt="Beach destination">
                    <h2>Navagio Beach</h2>
                    <p>A famous beach in Greece,
                    surrounded by cliffs.</p>
                </div>
            `;
            
        } 
else if (search.includes("temple")) {
    results.innerHTML = `
        <div class="place">
            <img src="https://images.unsplash.com/photo-1545569341-9eb8b30979d9" alt="Japanese Temple">
            <h2>Senso-ji Temple</h2>
            <p>A famous Buddhist temple in Tokyo, Japan.</p>
        </div>

        <div class="place">
            <img src="https://images.unsplash.com/photo-1528181304800-259b08848526" alt="Thai Temple">
            <h2>Wat Arun</h2>
            <p>A beautiful Buddhist temple in Bangkok, Thailand.</p>
        </div>
    `;
}

else {
            results.innerHTML = "<p>No recommendations found.</p>";
        }
    }
    function clearSearch() {
        document.getElementById("searchInput").value = "";
        document.getElementById("results").innerHTML = "";
    }
</script>

</body>
</html>
